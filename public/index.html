      trayEl.innerHTML='';for(let i=0;i<7;i++){const d=document.createElement('div');d.className='slot'+(S.tray[i]?' filled':'');d.textContent=S.tray[i]?.icon||'';trayEl.appendChild(d)}
      $('#level').textContent=tr('level',{n:S.level});$('#remain').textContent=S.tiles.filter(t=>!t.removed).length;$('#trayCount').textContent=`${S.tray.length} / 7`;
      $('#undo').disabled=S.used.undo||!S.history.length;$('#shuffle').disabled=S.used.shuffle;$('#rescue').disabled=S.used.rescue||!S.tray.length;
    }
    function pick(id){if(!S.playing)return;const t=S.tiles.find(x=>x.id===id);if(!t||t.removed||isBlocked(t))return buzz(tr('blocked'));S.history.push({id,tray:[...S.tray],combo:S.combo});t.removed=true;S.tray.push({icon:t.icon,source:id});tone(460);resolveTray();}
    function resolveTray(){const counts={};S.tray.forEach(x=>counts[x.icon]=(counts[x.icon]||0)+1);const hit=Object.keys(counts).find(k=>counts[k]>=3);if(hit){let n=3;S.tray=S.tray.filter(x=>x.icon===hit&&n--?false:true);S.combo++;tone(720);buzz(tr('match',{x:hit}));document.querySelectorAll('.slot').forEach(x=>x.classList.add('pop'))}else S.combo=0;render();setTimeout(checkEnd,220)}
    function checkEnd(){if(!S.tiles.some(t=>!t.removed)){const best=Math.max(+localStorage.getItem('ddx-best')||0,S.combo);localStorage.setItem('ddx-best',best);finish(true)}else if(S.tray.length>=7)finish(false)}
    function finish(win){S.playing=false;S.nextLevel=win;$('#modalHero').textContent=win?'🎉':'😵';$('#modalTitle').textContent=win?tr('win',{n:S.level}):tr('fail');$('#modalText').textContent=win?(S.level===1?tr('warm'):tr('streak',{n:S.level,t:formatTime(S.activeSeconds)})):tr('failText');$('#modalBtn').textContent=win?tr('next'):tr('retry');$('#modal').classList.remove('hidden')}
    function start(level){S.level=level||1;S.tiles=seededTiles(S.level);S.tray=[];S.history=[];S.used={undo:false,shuffle:false,rescue:false};S.combo=0;S.playing=true;S.nextLevel=false;$('#modal').classList.add('hidden');render()}
    function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
    setInterval(()=>{if(!S.playing)return;S.activeSeconds++;$('#timer').textContent=formatTime(S.activeSeconds)},1000);
    function buzz(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(buzz.timer);buzz.timer=setTimeout(()=>t.classList.remove('show'),1200)}
    function tone(freq){if(!S.sound)return;try{const a=new (AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=freq;g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.start();o.stop(a.currentTime+.12)}catch(e){}}
    async function shareGame(){const data={title:tr('name'),text:tr('shareText'),url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);buzz(tr('copied'))}}catch(e){if(e.name!=='AbortError')try{await navigator.clipboard.writeText(location.href);buzz(tr('copied'))}catch(_){}}}
    const ua=navigator.userAgent,isIPhone=/iPhone|iPod/i.test(ua),isSafari=/Safari/i.test(ua)&&!/(CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo|GSA|MicroMessenger|FBAN|FBAV|Instagram|Line|TikTok)/i.test(ua);
    if(isIPhone&&!isSafari&&!sessionStorage.getItem('browser-notice-dismissed'))$('#browserNotice').classList.remove('hidden');
    $('#continueHere').onclick=()=>{(navigator.clipboard?.writeText(location.href)||Promise.resolve()).catch(()=>{});sessionStorage.setItem('browser-notice-dismissed','1');$('#browserNotice').classList.add('hidden');if(navigator.share)navigator.share({title:tr('name'),text:tr('shareText'),url:location.href}).catch(()=>{});else prompt(gateText[2],location.href)};
    $('#copyForSafari').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);buzz(tr('copied'))}catch(e){prompt(gateText[2],location.href)}};
    $('#share').onclick=shareGame;$('#modalShare').onclick=shareGame;
    $('#modalBtn').onclick=()=>{if(S.nextLevel)start(S.level+1);else{S.activeSeconds=0;$('#timer').textContent='00:00';start(S.level)}};$('#restart').onclick=()=>{if(confirm(tr('restart'))){S.activeSeconds=0;$('#timer').textContent='00:00';start(S.level)}};
    $('#sound').onclick=()=>{S.sound=!S.sound;$('#sound').textContent=S.sound?'🔊':'🔇';buzz(tr(S.sound?'soundOn':'soundOff'))};
    $('#undo').onclick=()=>{if(S.used.undo||!S.history.length)return;const h=S.history.pop();S.tiles.find(t=>t.id===h.id).removed=false;S.tray=h.tray;S.combo=h.combo;S.used.undo=true;buzz(tr('undone'));render()};
    $('#shuffle').onclick=()=>{if(S.used.shuffle)return;const active=S.tiles.filter(t=>!t.removed),vals=active.map(t=>t.icon).sort(()=>Math.random()-.5);active.forEach((t,i)=>t.icon=vals[i]);S.used.shuffle=true;buzz(tr('shuffled'));render()};
    $('#rescue').onclick=()=>{if(S.used.rescue||!S.tray.length)return;const out=S.tray.splice(0,Math.min(3,S.tray.length));out.forEach(x=>S.tiles.find(t=>t.id===x.source).removed=true);S.used.rescue=true;buzz(tr('moved',{n:out.length}));render()};
    window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,180));if('ResizeObserver'in window)new ResizeObserver(fit).observe(board);for(let i=0;i<7;i++){const d=document.createElement('div');d.className='slot';trayEl.appendChild(d)}
  </script>

  <!-- ================= [改动3] 埋点 + 语言选择器（纯新增，不改原脚本） ================= -->
  <script>
  (function(){
    const LANGS = [
      { code:'en', name:'English',         region:'US' },
      { code:'zh', name:'简体中文',        region:'CN' },
      { code:'es', name:'Español',         region:'ES' },
      { code:'ar', name:'العربية',          region:'SA' },
      { code:'pt', name:'Português',       region:'BR' },
      { code:'id', name:'Bahasa Indonesia',region:'ID' },
      { code:'fr', name:'Français',        region:'FR' },
      { code:'ja', name:'日本語',           region:'JP' },
      { code:'ru', name:'Русский',         region:'RU' },
      { code:'de', name:'Deutsch',         region:'DE' },
      { code:'ko', name:'한국어',           region:'KR' },
      { code:'vi', name:'Tiếng Việt',      region:'VN' },
      { code:'tr', name:'Türkçe',          region:'TR' },
      { code:'hi', name:'हिन्दी',            region:'IN' },
      { code:'th', name:'ไทย',             region:'TH' },
    ];
    const COUNTRY_LANG = {
      CN:'zh',TW:'zht',HK:'zht',MO:'zht',SG:'en',
      US:'en',GB:'en',AU:'en',CA:'en',NZ:'en',IE:'en',IN:'en',PH:'en',
      ES:'es',MX:'es',AR:'es',CO:'es',CL:'es',PE:'es',VE:'es',UY:'es',
      SA:'ar',AE:'ar',EG:'ar',DZ:'ar',MA:'ar',IQ:'ar',JO:'ar',KW:'ar',QA:'ar',
      BR:'pt',PT:'pt', ID:'id',
      FR:'fr',BE:'fr',CH:'fr',SN:'fr',CI:'fr',CM:'fr',
      JP:'ja', RU:'ru',KZ:'ru',UA:'ru',BY:'ru',
      DE:'de',AT:'de', KR:'ko', VN:'vi', TR:'tr', TH:'th',
    };

    const urlLang = new URLSearchParams(location.search).get('lang');
    const saved   = localStorage.getItem('ddx-lang');
    const device  = (navigator.languages?.[0] || navigator.language || 'en').toLowerCase();

    function deviceToCode(l){
      if (l.startsWith('zh-tw')||l.startsWith('zh-hk')||l.startsWith('zh-mo')) return 'zht';
      if (l.startsWith('zh')) return 'zh';
      return LANGS.find(x => l.startsWith(x.code))?.code || 'en';
    }
    async function ipToCode(){
      try{
        const r = await fetch('/api/track/geo', { credentials:'same-origin' });
        const j = await r.json();
        if (j && j.country) return COUNTRY_LANG[j.country] || null;
      }catch(e){}
      return null;
    }
    async function resolveLang(){
      if (urlLang && LANGS.some(x => x.code === urlLang)) return urlLang;
      if (saved) return saved;
      const ipc = await ipToCode();
      if (ipc) return ipc;
      return deviceToCode(device);
    }

    async function fingerprint(){
      const raw = [navigator.userAgent, screen.width+'x'+screen.height,
        screen.colorDepth, new Date().getTimezoneOffset(),
        navigator.language, navigator.hardwareConcurrency, navigator.platform].join('|');
      try{
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
        const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
        return 'fp_' + hex.slice(0,10);
      }catch{ return 'fp_' + Math.random().toString(36).slice(2,12); }
    }

    const SESSION_KEY = 'ddx-session-id';
    let sessionId = sessionStorage.getItem(SESSION_KEY);
    if (!sessionId){
      sessionId = 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
      sessionStorage.setItem(SESSION_KEY, sessionId);
    }

    let visibleSeconds = 0, lastTick = Date.now(), hbInterval = 30;

    /* ⭐ 从游戏 DOM 里读当前关卡（解决"永远第 1 关"） */
    function getCurrentLevel() {
      try {
        const el = document.getElementById('level');
        if (!el) return 1;
        const m = String(el.textContent).match(/(\d+)/);
        return m ? parseInt(m[1], 10) : 1;
      } catch { return 1; }
    }
    /* ⭐ 从游戏 DOM 里读游戏内用时（秒） */
    function getPlaySeconds() {
      try {
        const el = document.getElementById('timer');
        if (!el) return 0;
        const m = String(el.textContent).match(/(\d+):(\d+)/);
        return m ? (+m[1]) * 60 + (+m[2]) : 0;
      } catch { return 0; }
    }

    function post(path, data, beacon){
      const url = '/api/track' + path;
      const body = JSON.stringify(data);
      if (beacon && navigator.sendBeacon){
        navigator.sendBeacon(url, new Blob([body], { type:'application/json' }));
        return;
      }
      fetch(url, { method:'POST', headers:{'Content-Type':'application/json'},
        body, credentials:'same-origin', keepalive:true }).catch(()=>{});
    }

    document.addEventListener('visibilitychange', () => {
      const now = Date.now();
      if (document.visibilityState === 'visible') lastTick = now;
      else visibleSeconds += (now - lastTick) / 1000;
    });

    window.DDX_TRACK = {
      onLevel(lv, cleared, playSec){
        post('/level', { session_id: sessionId, level_reached: lv, levels_cleared: cleared, play_seconds: playSec });
      },
      onLang(lang){ post('/lang', { session_id: sessionId, lang }); }
    };

    (async function init(){
      try{
        const r = await fetch('/api/track/config', { credentials:'same-origin' });
        const j = await r.json();
        hbInterval = j.heartbeat_interval || 30;
      }catch(e){}

      const lang = await resolveLang();
      window.__DDX_LANG = lang;

      const fp = await fingerprint();
      post('/enter', { session_id: sessionId, fingerprint: fp, lang,
        referrer: document.referrer || '' });

      lastTick = Date.now();
      setInterval(() => {
        const now = Date.now();
        if (document.visibilityState === 'visible') visibleSeconds += (now - lastTick) / 1000;
        lastTick = now;
        // ⭐ 从 DOM 读关卡和用时
        post('/heartbeat', {
          session_id: sessionId,
          visible_seconds: Math.round(visibleSeconds),
          level_reached: getCurrentLevel(),
          play_seconds: getPlaySeconds(),
        });
      }, hbInterval * 1000);

      const leave = () => post('/leave',
        { session_id: sessionId, visible_seconds: Math.round(visibleSeconds) }, true);
      window.addEventListener('pagehide', leave);
      window.addEventListener('beforeunload', leave);
    })();

    function openLangPicker(){
      const cur = window.__DDX_LANG || 'en';
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;background:#0008;z-index:200;display:grid;place-items:end center';
      const box = document.createElement('div');
      box.style.cssText = 'width:min(520px,100%);max-height:70vh;overflow:auto;background:#fff7dc;border-radius:20px 20px 0 0;padding:16px';
      box.innerHTML = '<div style="font-weight:800;margin-bottom:10px">🌐 选择语言 / Language</div>' +
        LANGS.map(l => `<button data-code="${l.code}" style="display:flex;width:100%;align-items:center;gap:10px;
          padding:12px;border:0;background:${l.code===cur?'#ffe9a8':'transparent'};
          border-radius:12px;font-size:15px;cursor:pointer;text-align:left">
          <span>${l.name}</span><span style="margin-left:auto;color:#7a8a80;font-size:12px">${l.code}</span></button>`).join('');
      ov.appendChild(box); document.body.appendChild(ov);
      ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
      box.querySelectorAll('button[data-code]').forEach(b => b.onclick = () => {
        const code = b.dataset.code;
        localStorage.setItem('ddx-lang', code);
        window.DDX_TRACK.onLang(code);
        location.reload();  // 方案 B 需刷新才能生效
      });
    }
    document.getElementById('langBtn').onclick = openLangPicker;
  })();
  </script>
