<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173d2d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>叠叠消｜原创三消小游戏</title>
  <meta name="description" content="一款原创的多层叠牌三消小游戏。找出未被遮挡的牌，三张同类即可消除。" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="叠叠消" />
  <meta property="og:title" content="叠叠消｜轻松上手的叠牌三消游戏" />
  <meta property="og:description" content="点选没有被遮挡的牌，凑齐三个相同图案即可消除。第一关轻松热身，后续关卡逐步升级！" />
  <meta property="og:image" content="https://tilepopgo.com/social-preview.png" />
  <meta property="og:image:secure_url" content="https://tilepopgo.com/social-preview.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="叠叠消多层叠牌三消游戏" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="叠叠消｜轻松上手的叠牌三消游戏" />
  <meta name="twitter:description" content="点选没有被遮挡的牌，凑齐三个相同图案即可消除。" />
  <meta name="twitter:image" content="https://tilepopgo.com/social-preview.png" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23ef6a4c'/%3E%3Ccircle cx='16' cy='32' r='7' fill='%23fff7d8'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23fff7d8'/%3E%3Ccircle cx='24' cy='16' r='7' fill='%23fff7d8'/%3E%3Ccircle cx='24' cy='16' r='2.8' fill='%23ef6a4c'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/game.css">
</head>
<body>
  <div class="hills"></div>
  <main class="app">
    <header>
      <div class="brand">
        <div class="stamp" aria-label="logo"><svg viewBox="0 0 48 48" width="28" height="28" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="32" r="9" fill="#fff7d8" opacity="0.9"/><circle cx="32" cy="32" r="9" fill="#fff7d8" opacity="0.9"/><circle cx="24" cy="16" r="9" fill="#fff7d8"/><circle cx="24" cy="16" r="3.5" fill="#ef6a4c"/></svg></div>
        <div>
          <h1 data-i18n="name">叠叠消</h1>
          <div class="sub" data-i18n="subtitle">点选最上层 · 三张同类即可消除</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="share" aria-label="分享游戏">↗</button>
        <button class="icon-btn" id="sound" aria-label="开关音效">🔊</button>
        <button class="icon-btn" id="restart" aria-label="重新开始">↻</button>
        <button class="icon-btn" id="langBtn" aria-label="切换语言">🌐</button>
      </div>
    </header>

    <section class="status" aria-label="游戏状态">
      <div class="pill"><b id="level">第 1 关</b><span data-i18n="currentLevel">当前关卡</span></div>
      <div class="pill"><b id="remain">0</b><span data-i18n="remaining">剩余牌</span></div>
      <div class="pill"><b id="timer">00:00</b><span data-i18n="gameTime">游戏用时</span></div>
    </section>

    <section class="game-shell" aria-label="叠牌游戏区"><div id="board"></div></section>

    <section class="tray-wrap">
      <div class="tray-label"><span data-i18n="tray">收集槽</span><span id="trayCount">0 / 7</span></div>
      <div class="tray" id="tray"></div>
    </section>

    <section class="tools">
      <button class="tool" id="undo">↩ <span data-i18n="undo">撤回</span><small data-i18n="once">剩余 1 次</small></button>
      <button class="tool" id="shuffle">⤨ <span data-i18n="shuffle">洗牌</span><small data-i18n="once">剩余 1 次</small></button>
      <button class="tool" id="rescue">⌄ <span data-i18n="rescue">移出</span><small data-i18n="once">剩余 1 次</small></button>
    </section>
  </main>

  <div class="overlay" id="modal">
    <div class="card">
      <div class="hero" id="modalHero">🌿</div>
      <h2 id="modalTitle" data-i18n="ready">准备好了吗？</h2>
      <p id="modalText" data-i18n="intro">从没有被其他牌遮住的牌开始，凑齐三个相同图案。收集槽满了就会失败。</p>
      <div class="card-actions">
        <button class="primary" id="modalBtn" data-i18n="start">开始挑战</button>
        <button class="secondary" id="modalShare">↗ <span data-i18n="share">分享给好友</span></button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="browserNotice" style="z-index:200">
    <div class="card">
      <div class="hero">🧭</div>
      <h2 id="browserTitle">建议使用 Safari</h2>
      <p id="browserText">为了获得更流畅的 iPhone 游戏体验，请复制网址，然后打开 Safari 粘贴访问。</p>
      <div class="card-actions">
        <button class="primary" id="copyForSafari">复制网址</button>
        <button class="secondary" id="continueHere">继续使用当前浏览器</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/game.js"></script>
</body>
</html>
