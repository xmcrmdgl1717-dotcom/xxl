<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霓虹方块 · 100关 · 道具与技能</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0e1a;
    color: #e8eaf6;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 12px;
  }
  .game-wrap {
    width: 100%;
    max-width: 460px;
    background: #141a2e;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 0 40px rgba(90, 120, 255, 0.15);
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
    color: #9aa4c7;
  }
  .top-bar .level-name { color: #7c9cff; font-weight: 600; font-size: 15px; }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 10px;
  }
  .stat {
    flex: 1;
    background: #1e2744;
    border-radius: 9px;
    padding: 6px 8px;
    text-align: center;
    font-size: 11px;
    color: #9aa4c7;
  }
  .stat strong { display: block; color: #e8eaf6; font-size: 15px; margin-top: 2px; }
  .target-bar {
    background: #1e2744;
    border-radius: 9px;
    padding: 8px 12px;
    margin-bottom: 10px;
    font-size: 12px;
    line-height: 1.6;
  }
  .target-bar .done { color: #4ade80; }
  .target-bar .pending { color: #fbbf24; }

  /* 道具栏 */
  .item-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .item-slot {
    flex: 1;
    min-width: 60px;
    background: #1e2744;
    border-radius: 9px;
    padding: 6px 4px;
    text-align: center;
    font-size: 10px;
    color: #9aa4c7;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
  }
  .item-slot:hover { background: #263056; }
  .item-slot.active { border-color: #7c9cff; background: #2e3d6e; }
  .item-slot.empty { opacity: 0.35; cursor: not-allowed; }
  .item-slot .item-icon { font-size: 18px; display: block; margin-bottom: 2px; }
  .item-slot .item-count { color: #7c9cff; font-weight: 700; }

  .board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
    aspect-ratio: 1 / 1;
    margin-bottom: 10px;
  }
  .cell {
    background: #1e2744;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: transform 0.08s, background 0.15s;
  }
  .cell:active { transform: scale(0.92); }
  .cell.selected { box-shadow: 0 0 0 2px #7c9cff inset; background: #2e3d6e; }
  .cell.empty { background: #10162a; cursor: default; }
  .cell.ice { background: #2a3a5e; }
  .cell.ice::after { content: '❄'; position: absolute; top: 1px; right: 3px; font-size: 8px; color: #9ecbff; }
  .cell.ice2 { background: #3a4a7e; }
  .cell.ice2::after { content: '❄❄'; position: absolute; top: 0; right: 2px; font-size: 7px; color: #cfe4ff; }
  .cell.locked { background: #3a2a4e; }
  .cell.locked::after { content: '🔗'; position: absolute; top: 1px; right: 2px; font-size: 8px; }
  .cell.bomb { background: #4e2a2a; }
  .cell.bomb::after { content: '💣'; position: absolute; top: 1px; right: 2px; font-size: 8px; }
  .cell.rainbow { background: linear-gradient(135deg, #7c9cff, #f472b6, #fbbf24); }

  .footer {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .btn {
    flex: 1;
    background: #2e3d6e;
    border: none;
    color: #e8eaf6;
    padding: 9px 10px;
    border-radius: 9px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
    min-width: 60px;
  }
  .btn:hover { background: #3a4d8a; }
  .btn.primary { background: #7c9cff; color: #0b0e1a; font-weight: 600; }
  .btn.primary:hover { background: #9ab3ff; }
  .btn:disabled { background: #2a3050; color: #5a6288; cursor: not-allowed; }
  .hint {
    font-size: 10px;
    color: #6b76a0;
    text-align: center;
    margin-top: 8px;
    line-height: 1.6;
  }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 18, 0.9);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 14px;
    z-index: 10;
    overflow-y: auto;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: #141a2e;
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 380px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal-content h3 { margin-bottom: 10px; font-size: 17px; color: #7c9cff; }
  .modal-content p { font-size: 13px; color: #9aa4c7; margin-bottom: 12px; line-height: 1.7; }
  .stars { font-size: 24px; margin-bottom: 8px; letter-spacing: 3px; text-align: center; }
  .modal-content .center { text-align: center; }

  /* 商店/技能条目 */
  .shop-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 11px;
    background: #1e2744;
    border-radius: 9px;
    margin-bottom: 6px;
    font-size: 12px;
    gap: 8px;
  }
  .shop-item .info { flex: 1; text-align: left; }
  .shop-item .info small { color: #6b76a0; display: block; font-size: 10px; margin-top: 2px; }
  .shop-item button {
    background: #7c9cff;
    border: none;
    color: #0b0e1a;
    padding: 5px 10px;
    border-radius: 7px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .shop-item button:disabled { background: #3a4160; color: #6b76a0; cursor: not-allowed; }
  .tab-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .tab-bar button {
    flex: 1;
    background: #1e2744;
    border: none;
    color: #9aa4c7;
    padding: 8px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .tab-bar button.active { background: #7c9cff; color: #0b0e1a; font-weight: 700; }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    max-height: 340px;
    overflow-y: auto;
    margin-bottom: 10px;
  }
  .level-btn {
    background: #1e2744;
    border: none;
    color: #e8eaf6;
    padding: 9px 0;
    border-radius: 7px;
    font-size: 12px;
    cursor: pointer;
  }
  .level-btn.locked { background: #10162a; color: #4a5278; cursor: not-allowed; }
  .level-btn.current { background: #7c9cff; color: #0b0e1a; font-weight: 700; }
  .level-btn.done { background: #2a4a3a; color: #4ade80; }
</style>
</head>
<body>

<div class="game-wrap">
  <div class="top-bar">
    <span class="level-name" id="levelName">第 1 关</span>
    <span>积分 <strong id="score" style="color:#7c9cff;">0</strong></span>
  </div>

  <div class="stats">
    <div class="stat">步数<strong id="movesLeft">∞</strong></div>
    <div class="stat">时间<strong id="timeLeft">∞</strong></div>
    <div class="stat">能量<strong id="energy">20</strong></div>
  </div>

  <div class="target-bar" id="targetBar"></div>

  <div class="item-bar" id="itemBar"></div>

  <div class="board" id="board"></div>

  <div class="footer">
    <button class="btn" id="restartBtn">重玩</button>
    <button class="btn" id="levelsBtn">关卡</button>
    <button class="btn primary" id="shopBtn">工坊</button>
  </div>

  <p class="hint">
    点击两个相邻方块交换，三个以上相同符号即可消除。<br>
    积分仅用于游戏内道具和技能，无任何现实价值。
  </p>
</div>

<!-- 通关弹窗 -->
<div class="modal" id="winModal">
  <div class="modal-content center">
    <h3>通关！</h3>
    <div class="stars" id="winStars">★★★</div>
    <p id="winReward"></p>
    <button class="btn primary" style="width:100%;" id="nextLevelBtn">下一关</button>
  </div>
</div>

<!-- 失败弹窗 -->
<div class="modal" id="loseModal">
  <div class="modal-content center">
    <h3>挑战失败</h3>
    <p id="loseMsg">再试一次吧！</p>
    <button class="btn primary" style="width:100%;" id="retryBtn">重玩本关</button>
  </div>
</div>

<!-- 工坊弹窗（道具 + 技能） -->
<div class="modal" id="shopModal">
  <div class="modal-content">
    <h3>霓虹工坊</h3>
    <p style="font-size:11px;">积分仅限游戏内使用，无任何现实价值</p>
    <div class="tab-bar">
      <button id="tabItems" class="active">道具</button>
      <button id="tabSkills">技能树</button>
    </div>
    <div id="shopContent"></div>
    <button class="btn" style="width:100%;margin-top:10px;" id="closeShop">关闭</button>
  </div>
</div>

<!-- 关卡选择弹窗 -->
<div class="modal" id="levelsModal">
  <div class="modal-content">
    <h3>选择关卡</h3>
    <div class="level-grid" id="levelGrid"></div>
    <button class="btn" style="width:100%;" id="closeLevels">关闭</button>
  </div>
</div>

<script>
const ROWS = 6, COLS = 6;
const SYMBOLS = ['◆', '●', '▲', '★', '⬟', '♥'];

// ============ 道具定义 ============
const ITEMS = {
  hammer:   { name: '锤子',   icon: '🔨', price: 30,  desc: '砸掉任意一个方块' },
  swap:     { name: '换位器', icon: '🔄', price: 50,  desc: '交换任意两个不相邻方块' },
  freeze:   { name: '冰冻',   icon: '🧊', price: 40,  desc: '冻结时间 5 秒（限时关）' },
  bomb:     { name: '炸弹',   icon: '💣', price: 80,  desc: '炸掉 3×3 范围' },
  rainbow:  { name: '彩虹笔', icon: '🌈', price: 120, desc: '把任意方块变成彩虹块' }
};

// ============ 技能树定义 ============
const SKILLS = [
  { id: 'combo1', name: '连消加成 I',  desc: '4连消额外 +5 分',   cost: 100,  requires: null },
  { id: 'combo2', name: '连消加成 II', desc: '5连消额外 +15 分',  cost: 300,  requires: 'combo1' },
  { id: 'combo3', name: '连消加成 III',desc: '6连消以上额外 +30 分',cost: 800, requires: 'combo2' },
  { id: 'ice1',   name: '冰霜行者 I',  desc: '破冰效率 +1',        cost: 200,  requires: null },
  { id: 'ice2',   name: '冰霜行者 II', desc: '冰块可直接点击破除',  cost: 600,  requires: 'ice1' },
  { id: 'ice3',   name: '冰霜行者 III',desc: '每关开局自动清除 1 个冰块', cost: 1500, requires: 'ice2' },
  { id: 'time1',  name: '时间掌控 I',  desc: '限时关卡 +5 秒',     cost: 250,  requires: null },
  { id: 'time2',  name: '时间掌控 II', desc: '限时关卡 +10 秒',    cost: 700,  requires: 'time1' },
  { id: 'time3',  name: '时间掌控 III',desc: '限时关卡 +15 秒',    cost: 1800, requires: 'time2' },
  { id: 'move1',  name: '步数大师 I',  desc: '步数关卡 +3 步',     cost: 300,  requires: null },
  { id: 'move2',  name: '步数大师 II', desc: '步数关卡 +6 步',     cost: 900,  requires: 'move1' },
  { id: 'energy1',name: '能量核心 I',  desc: '每关能量 +5',        cost: 400,  requires: null },
  { id: 'energy2',name: '能量核心 II', desc: '每关能量 +10',       cost: 1200, requires: 'energy1' }
];

// ============ 关卡配置 ============
function makeLevels() {
  const levels = [];
  const names = [
    '初次点亮','双连消','指定符号','步数初现','冰块登场','连锁入门','限时60秒','角落挑战',
    '双目标','锁链','双层冰','传送带','颜色限制','步数障碍','倒计时冰','章节Boss',
    '极速30秒','步数换时间','禁用交换','单符号狂欢','连锁反应','限时锁链','章节Boss','炸弹方块',
    '彩虹块','炸弹步数','彩虹连锁','障碍矩阵','限时炸弹','章节Boss','随机禁消','步数倒扣',
    '多阶段','极限限时','全障碍','一命通关','最终Boss','霓虹回响','冰火两重','锁链迷宫',
    '时间沙漏','符号风暴','炸弹狂欢','彩虹之路','冰封王座','连锁大师','限时绝境','章节Boss',
    '霓虹深渊','双倍积分','三倍难度','冰锁交加','极速连锁','炸弹矩阵','彩虹风暴','限时冰锁',
    '步数极限','多目标','章节Boss','霓虹试炼','随机风暴','双层锁链','时间竞赛','炸弹彩虹',
    '冰封连锁','符号猎手','限时挑战','章节Boss','霓虹狂潮','积分冲刺','障碍大师','彩虹冰锁',
    '炸弹风暴','限时连锁','步数大师','多阶段Boss','霓虹终章','冰火极限','锁链风暴','彩虹炸弹',
    '时间极限','符号大师','障碍狂欢','章节Boss','霓虹巅峰','双重限时','炸弹冰锁','彩虹连锁',
    '极限步数','多目标大师','限时绝杀','霓虹之巅','终极试炼','冰锁炸弹','彩虹风暴','时间尽头',
    '符号终结','障碍终结','章节Boss','霓虹大师','最终挑战'
  ];
  for (let i = 1; i <= 100; i++) {
    const baseScore = 300 + (i - 1) * 25;
    const moves = i <= 2 ? null : Math.max(10, 25 - Math.floor(i / 8));
    const time = (i >= 43 && i <= 46) || (i >= 58 && i <= 60) || (i >= 73 && i <= 75) ? 60 : null;
    const obstacles = [];
    if (i >= 12) obstacles.push('ice');
    if (i >= 22) obstacles.push('lock');
    if (i >= 25) obstacles.push('ice2');
    if (i >= 63) obstacles.push('bomb');
    if (i >= 66) obstacles.push('rainbow');
    const targetType = i % 3 === 0 ? 'symbol' : (i % 5 === 0 ? 'clear' : 'score');
    const targetSymbol = SYMBOLS[i % SYMBOLS.length];
    const targetCount = targetType === 'symbol' ? 5 + Math.floor(i / 10) : 0;
    levels.push({
      id: i,
      name: names[i - 1] || ('第 ' + i + ' 关'),
      target: { type: targetType, value: targetType === 'score' ? baseScore : targetCount, symbol: targetSymbol },
      moves, time, obstacles,
      iceCount: obstacles.includes('ice') ? 4 + Math.floor(i / 12) : 0,
      ice2Count: obstacles.includes('ice2') ? 2 + Math.floor(i / 20) : 0,
      lockCount: obstacles.includes('lock') ? 2 + Math.floor(i / 15) : 0,
      bombCount: obstacles.includes('bomb') ? 1 + Math.floor(i / 30) : 0,
      rainbowCount: obstacles.includes('rainbow') ? 1 : 0
    });
  }
  return levels;
}
const LEVELS = makeLevels();

// ============ 状态 ============
let board = [], iceLayer = [], lockLayer = [], bombLayer = [], rainbowLayer = [];
let score = 0, energy = 20, currentLevelIndex = 0;
let selected = null, busy = false;
let movesLeft = null, timeLeft = null, timerInterval = null;
let levelProgress = { score: 0, symbolCount: 0, cleared: 0 };
let ownedSkins = new Set(['◆']), activeSkin = '◆';
let maxUnlockedLevel = 0;
let ownedSkills = new Set();
let inventory = { hammer: 0, swap: 0, freeze: 0, bomb: 0, rainbow: 0 };
let activeItem = null;      // 当前选中的道具
let swapFirst = null;       // 换位器第一次点击
let shopTab = 'items';

// 存档
try {
  const saved = localStorage.getItem('neon_save_v2');
  if (saved) {
    const d = JSON.parse(saved);
    score = d.score || 0;
    ownedSkins = new Set(d.ownedSkins || ['◆']);
    activeSkin = d.activeSkin || '◆';
    maxUnlockedLevel = d.maxUnlockedLevel || 0;
    ownedSkills = new Set(d.ownedSkills || []);
    inventory = Object.assign({ hammer: 0, swap: 0, freeze: 0, bomb: 0, rainbow: 0 }, d.inventory || {});
  }
} catch (e) {}

function save() {
  try {
    localStorage.setItem('neon_save_v2', JSON.stringify({
      score, ownedSkins: Array.from(ownedSkins), activeSkin, maxUnlockedLevel,
      ownedSkills: Array.from(ownedSkills), inventory
    }));
  } catch (e) {}
}

const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const energyEl = document.getElementById('energy');
const movesEl = document.getElementById('movesLeft');
const timeEl = document.getElementById('timeLeft');
const levelNameEl = document.getElementById('levelName');
const targetBarEl = document.getElementById('targetBar');
const itemBarEl = document.getElementById('itemBar');

function currentLevel() { return LEVELS[currentLevelIndex]; }
function hasSkill(id) { return ownedSkills.has(id); }

// ============ 初始化关卡 ============
function initLevel(index) {
  currentLevelIndex = index;
  const lv = currentLevel();
  selected = null; busy = false; activeItem = null; swapFirst = null;
  movesLeft = lv.moves;
  timeLeft = lv.time;
  // 技能加成
  if (timeLeft !== null) {
    if (hasSkill('time3')) timeLeft += 15;
    else if (hasSkill('time2')) timeLeft += 10;
    else if (hasSkill('time1')) timeLeft += 5;
  }
  if (movesLeft !== null) {
    if (hasSkill('move2')) movesLeft += 6;
    else if (hasSkill('move1')) movesLeft += 3;
  }
  let baseEnergy = 20;
  if (hasSkill('energy2')) baseEnergy += 10;
  else if (hasSkill('energy1')) baseEnergy += 5;
  energy = baseEnergy;
  levelProgress = { score: 0, symbolCount: 0, cleared: 0 };

  // 生成棋盘
  board = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) row.push(randomSymbol());
    board.push(row);
  }
  iceLayer = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  lockLayer = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  bombLayer = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  rainbowLayer = Array.from({ length: ROWS }, () => Array(COLS).fill(false));

  let placed = 0;
  while (placed < lv.iceCount) {
    const r = 1 + Math.floor(Math.random() * (ROWS - 1));
    const c = Math.floor(Math.random() * COLS);
    if (iceLayer[r][c] === 0) { iceLayer[r][c] = 1; placed++; }
  }
  placed = 0;
  while (placed < lv.ice2Count) {
    const r = 1 + Math.floor(Math.random() * (ROWS - 1));
    const c = Math.floor(Math.random() * COLS);
    if (iceLayer[r][c] === 0) { iceLayer[r][c] = 2; placed++; }
  }
  placed = 0;
  while (placed < lv.lockCount) {
    const r = 1 + Math.floor(Math.random() * (ROWS - 1));
    const c = Math.floor(Math.random() * COLS);
    if (!lockLayer[r][c] && iceLayer[r][c] === 0) { lockLayer[r][c] = true; placed++; }
  }
  placed = 0;
  while (placed < lv.bombCount) {
    const r = 1 + Math.floor(Math.random() * (ROWS - 1));
    const c = Math.floor(Math.random() * COLS);
    if (!bombLayer[r][c] && !lockLayer[r][c] && iceLayer[r][c] === 0) { bombLayer[r][c] = true; placed++; }
  }
  placed = 0;
  while (placed < lv.rainbowCount) {
    const r = 1 + Math.floor(Math.random() * (ROWS - 1));
    const c = Math.floor(Math.random() * COLS);
    if (!bombLayer[r][c] && !lockLayer[r][c] && iceLayer[r][c] === 0) { rainbowLayer[r][c] = true; placed++; }
  }

  // 技能：开局自动清除 1 个冰块
  if (hasSkill('ice3')) {
    for (let r = 0; r < ROWS; r++) {
      let done = false;
      for (let c = 0; c < COLS; c++) {
        if (iceLayer[r][c] > 0) { iceLayer[r][c] = 0; levelProgress.cleared++; done = true; break; }
      }
      if (done) break;
    }
  }

  // 清除初始三连
  let guard = 0;
  while (findMatches().length > 0 && guard < 100) {
    findMatches().forEach(({ r, c }) => {
      if (iceLayer[r][c] === 0 && !lockLayer[r][c]) board[r][c] = randomSymbol();
    });
    guard++;
  }

  levelNameEl.textContent = `第 ${lv.id} 关 · ${lv.name}`;
  if (timeLeft !== null) startTimer(); else stopTimer();
  render();
}

function startTimer() {
  stopTimer();
  timerInterval = setInterval(() => {
    if (busy) return;
    timeLeft--;
    if (timeLeft <= 0) { timeLeft = 0; render(); stopTimer(); checkLose(); return; }
    render();
  }, 1000);
}
function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

function randomSymbol() {
  const lv = currentLevel();
  let pool = SYMBOLS;
  if (lv && lv.id === 31) pool = ['◆', '●', '▲'];
  if (lv && lv.id === 52) pool = ['★', '♥'];
  return pool[Math.floor(Math.random() * pool.length)];
}

// ============ 渲染 ============
function render() {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (selected && selected.r === r && selected.c === c) cell.classList.add('selected');
      if (iceLayer[r][c] === 1) cell.classList.add('ice');
      if (iceLayer[r][c] === 2) cell.classList.add('ice2');
      if (lockLayer[r][c]) cell.classList.add('locked');
      if (bombLayer[r][c]) cell.classList.add('bomb');
      if (rainbowLayer[r][c]) cell.classList.add('rainbow');
      const sym = board[r][c];
      if (sym) {
        cell.textContent = rainbowLayer[r][c] ? '🌈' : sym;
        if (ownedSkins.has(sym) && sym === activeSkin) cell.style.color = '#7c9cff';
      } else cell.classList.add('empty');
      cell.addEventListener('click', () => onCellClick(r, c));
      boardEl.appendChild(cell);
    }
  }
  scoreEl.textContent = score;
  energyEl.textContent = energy;
  movesEl.textContent = movesLeft === null ? '∞' : movesLeft;
  timeEl.textContent = timeLeft === null ? '∞' : timeLeft + 's';

  // 目标栏
  const lv = currentLevel();
  let targetText = '';
  if (lv.target.type === 'score') targetText = `目标：达到 ${lv.target.value} 分（当前 ${levelProgress.score}）`;
  else if (lv.target.type === 'symbol') targetText = `目标：消除 ${lv.target.value} 个 ${lv.target.symbol}（当前 ${levelProgress.symbolCount}）`;
  else { const total = lv.iceCount + lv.ice2Count + lv.lockCount; targetText = `目标：清除全部障碍（${levelProgress.cleared}/${total}）`; }
  targetBarEl.innerHTML = `<span class="${checkWin() ? 'done' : 'pending'}">${targetText}</span>`;

  renderItemBar();
}

function renderItemBar() {
  itemBarEl.innerHTML = '';
  Object.keys(ITEMS).forEach(key => {
    const it = ITEMS[key];
    const count = inventory[key] || 0;
    const slot = document.createElement('div');
    slot.className = 'item-slot' + (count <= 0 ? ' empty' : '') + (activeItem === key ? ' active' : '');
    slot.innerHTML = `<span class="item-icon">${it.icon}</span>${it.name}<br><span class="item-count">×${count}</span>`;
    slot.title = it.desc;
    slot.onclick = () => {
      if (count <= 0) return;
      activeItem = activeItem === key ? null : key;
      swapFirst = null;
      render();
    };
    itemBarEl.appendChild(slot);
  });
}

// ============ 点击逻辑 ============
function onCellClick(r, c) {
  if (busy) return;
  if (movesLeft !== null && movesLeft <= 0) return;
  if (timeLeft !== null && timeLeft <= 0) return;

  // 道具模式
  if (activeItem) { useItemOnCell(activeItem, r, c); return; }

  if (!selected) {
    if (lockLayer[r][c]) return;
    selected = { r, c };
    render(); return;
  }
  if (selected.r === r && selected.c === c) { selected = null; render(); return; }
  const dr = Math.abs(selected.r - r), dc = Math.abs(selected.c - c);
  if (dr + dc === 1) {
    if (lockLayer[r][c] || lockLayer[selected.r][selected.c]) { selected = null; render(); return; }
    swap(selected.r, selected.c, r, c);
  } else { selected = { r, c }; render(); }
}

// ============ 道具使用 ============
function useItemOnCell(itemKey, r, c) {
  if (inventory[itemKey] <= 0) { activeItem = null; render(); return; }

  if (itemKey === 'hammer') {
    if (iceLayer[r][c] > 0) { iceLayer[r][c]--; if (iceLayer[r][c] === 0) levelProgress.cleared++; }
    board[r][c] = randomSymbol();
    inventory.hammer--;
    activeItem = null;
    save(); render();
    setTimeout(resolveMatches, 100);
    return;
  }
  if (itemKey === 'bomb') {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
        if (iceLayer[nr][nc] > 0) { iceLayer[nr][nc] = 0; levelProgress.cleared++; }
        if (lockLayer[nr][nc]) { lockLayer[nr][nc] = false; levelProgress.cleared++; }
        bombLayer[nr][nc] = false;
        board[nr][nc] = null;
      }
    }
    inventory.bomb--;
    activeItem = null;
    save(); render();
    setTimeout(resolveMatches, 100);
    return;
  }
  if (itemKey === 'rainbow') {
    rainbowLayer[r][c] = true;
    inventory.rainbow--;
    activeItem = null;
    save(); render();
    return;
  }
  if (itemKey === 'freeze') {
    if (timeLeft !== null) timeLeft += 5;
    inventory.freeze--;
    activeItem = null;
    save(); render();
    return;
  }
  if (itemKey === 'swap') {
    if (!swapFirst) { swapFirst = { r, c }; return; }
    if (swapFirst.r === r && swapFirst.c === c) { swapFirst = null; return; }
    const tmp = board[swapFirst.r][swapFirst.c];
    board[swapFirst.r][swapFirst.c] = board[r][c];
    board[r][c] = tmp;
    inventory.swap--;
    swapFirst = null;
    activeItem = null;
    save(); render();
    setTimeout(resolveMatches, 100);
    return;
  }
}

// ============ 交换与消除 ============
function swap(r1, c1, r2, c2) {
  const tmp = board[r1][c1];
  board[r1][c1] = board[r2][c2];
  board[r2][c2] = tmp;
  selected = null;
  if (findMatches().length === 0) {
    const t2 = board[r1][c1];
    board[r1][c1] = board[r2][c2];
    board[r2][c2] = t2;
    render(); return;
  }
  if (movesLeft !== null) movesLeft--;
  energy = Math.max(0, energy - 1);
  busy = true; render();
  setTimeout(resolveMatches, 180);
}

function findMatches() {
  const matched = new Set();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS - 2; c++) {
    const s = board[r][c];
    if (s && s === board[r][c+1] && s === board[r][c+2]) {
      let k = c; while (k < COLS && board[r][k] === s) { matched.add(r + ',' + k); k++; }
    }
  }
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS - 2; r++) {
    const s = board[r][c];
    if (s && s === board[r+1][c] && s === board[r+2][c]) {
      let k = r; while (k < ROWS && board[k][c] === s) { matched.add(k + ',' + c); k++; }
    }
  }
  return Array.from(matched).map(key => { const [r, c] = key.split(',').map(Number); return { r, c }; });
}

function resolveMatches() {
  const matches = findMatches();
  if (matches.length === 0) { busy = false; render(); checkWinLose(); return; }

  // 连消加成技能
  let comboBonus = 0;
  if (matches.length >= 6 && hasSkill('combo3')) comboBonus = 30;
  else if (matches.length >= 5 && hasSkill('combo2')) comboBonus = 15;
  else if (matches.length >= 4 && hasSkill('combo1')) comboBonus = 5;

  // 冰块
  const iceToBreak = new Set();
  matches.forEach(({ r, c }) => {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && iceLayer[nr][nc] > 0) iceToBreak.add(nr + ',' + nc);
    }
  });
  const icePower = hasSkill('ice1') ? 2 : 1;
  iceToBreak.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    if (iceLayer[r][c] > 0) {
      iceLayer[r][c] = Math.max(0, iceLayer[r][c] - icePower);
      if (iceLayer[r][c] === 0) levelProgress.cleared++;
    }
  });

  // 锁链
  const lockToBreak = new Set();
  matches.forEach(({ r, c }) => {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && lockLayer[nr][nc]) lockToBreak.add(nr + ',' + nc);
    }
  });
  lockToBreak.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    if (lockLayer[r][c]) { lockLayer[r][c] = false; levelProgress.cleared++; }
  });

  // 炸弹
  const bombToExplode = [];
  matches.forEach(({ r, c }) => { if (bombLayer[r][c]) bombToExplode.push({ r, c }); });
  bombToExplode.forEach(({ r, c }) => {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
        if (iceLayer[nr][nc] > 0) { iceLayer[nr][nc] = 0; levelProgress.cleared++; }
        if (lockLayer[nr][nc]) { lockLayer[nr][nc] = false; levelProgress.cleared++; }
        bombLayer[nr][nc] = false;
        if (board[nr][nc]) board[nr][nc] = null;
      }
    }
  });

  // 计分
  matches.forEach(({ r, c }) => {
    const s = board[r][c];
    if (s) {
      levelProgress.score += 10;
      if (s === currentLevel().target.symbol) levelProgress.symbolCount++;
      board[r][c] = null;
    }
    bombLayer[r][c] = false;
    rainbowLayer[r][c] = false;
  });
  score += matches.length * 10 + comboBonus;
  levelProgress.score += comboBonus;

  render();
  setTimeout(() => {
    for (let c = 0; c < COLS; c++) {
      const col = [];
      for (let r = ROWS - 1; r >= 0; r--) if (board[r][c]) col.push(board[r][c]);
      for (let r = ROWS - 1; r >= 0; r--) board[r][c] = col[ROWS - 1 - r] || randomSymbol();
    }
    render();
    setTimeout(resolveMatches, 180);
  }, 180);
}

// ============ 胜负 ============
function checkWin() {
  const lv = currentLevel();
  if (lv.target.type === 'score') return levelProgress.score >= lv.target.value;
  if (lv.target.type === 'symbol') return levelProgress.symbolCount >= lv.target.value;
  const total = lv.iceCount + lv.ice2Count + lv.lockCount;
  return levelProgress.cleared >= total;
}

function checkWinLose() {
  if (checkWin()) {
    stopTimer();
    const lv = currentLevel();
    let stars = 1;
    if (movesLeft !== null && movesLeft >= Math.floor(lv.moves * 0.4)) stars = 2;
    if (movesLeft !== null && movesLeft >= Math.floor(lv.moves * 0.7)) stars = 3;
    if (timeLeft !== null && timeLeft >= Math.floor(lv.time * 0.4)) stars = 2;
    if (timeLeft !== null && timeLeft >= Math.floor(lv.time * 0.7)) stars = 3;
    const bonus = stars * 30;
    score += bonus;
    if (lv.id > maxUnlockedLevel) maxUnlockedLevel = lv.id;
    save();
    document.getElementById('winStars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    document.getElementById('winReward').textContent = `获得 ${bonus} 积分！可用于工坊购买道具或解锁技能。`;
    document.getElementById('winModal').classList.add('show');
    render();
    return;
  }
  if (movesLeft !== null && movesLeft <= 0) { checkLose(); return; }
  if (timeLeft !== null && timeLeft <= 0) { checkLose(); return; }
  if (energy <= 0) { checkLose(); return; }
}

function checkLose() {
  stopTimer();
  document.getElementById('loseMsg').textContent = energy <= 0 ? '能量已耗尽，再试一次吧！' : '步数或时间已用完，再试一次吧！';
  document.getElementById('loseModal').classList.add('show');
}

// ============ 弹窗按钮 ============
document.getElementById('nextLevelBtn').onclick = () => {
  document.getElementById('winModal').classList.remove('show');
  if (currentLevelIndex < LEVELS.length - 1) initLevel(currentLevelIndex + 1);
  else alert('恭喜通关全部 100 关！');
};
document.getElementById('retryBtn').onclick = () => {
  document.getElementById('loseModal').classList.remove('show');
  initLevel(currentLevelIndex);
};
document.getElementById('restartBtn').onclick = () => { if (!busy) initLevel(currentLevelIndex); };
document.getElementById('levelsBtn').onclick = () => { renderLevelGrid(); document.getElementById('levelsModal').classList.add('show'); };
document.getElementById('closeLevels').onclick = () => document.getElementById('levelsModal').classList.remove('show');
document.getElementById('shopBtn').onclick = () => { renderShop(); document.getElementById('shopModal').classList.add('show'); };
document.getElementById('closeShop').onclick = () => document.getElementById('shopModal').classList.remove('show');

document.getElementById('tabItems').onclick = () => { shopTab = 'items'; renderShop(); };
document.getElementById('tabSkills').onclick = () => { shopTab = 'skills'; renderShop(); };

function renderShop() {
  document.getElementById('tabItems').className = shopTab === 'items' ? 'active' : '';
  document.getElementById('tabSkills').className = shopTab === 'skills' ? 'active' : '';
  const c = document.getElementById('shopContent');
  c.innerHTML = '';
  if (shopTab === 'items') {
    Object.keys(ITEMS).forEach(key => {
      const it = ITEMS[key];
      const item = document.createElement('div');
      item.className = 'shop-item';
      item.innerHTML = `<div class="info">${it.icon} ${it.name} <small>${it.desc} · 持有 ${inventory[key] || 0}</small></div>`;
      const btn = document.createElement('button');
      btn.textContent = `${it.price} 积分`;
      btn.disabled = score < it.price;
      btn.onclick = () => {
        if (score >= it.price) { score -= it.price; inventory[key] = (inventory[key] || 0) + 1; save(); renderShop(); render(); }
      };
      item.appendChild(btn);
      c.appendChild(item);
    });
  } else {
    SKILLS.forEach(sk => {
      const owned = ownedSkills.has(sk.id);
      const canBuy = !owned && (!sk.requires || ownedSkills.has(sk.requires));
      const item = document.createElement('div');
      item.className = 'shop-item';
      item.innerHTML = `<div class="info">${sk.name} <small>${sk.desc} · ${sk.cost} 积分</small></div>`;
      const btn = document.createElement('button');
      if (owned) { btn.textContent = '已解锁'; btn.disabled = true; }
      else if (!canBuy) { btn.textContent = '需前置'; btn.disabled = true; }
      else {
        btn.textContent = '解锁';
        btn.disabled = score < sk.cost;
        btn.onclick = () => {
          if (score >= sk.cost) { score -= sk.cost; ownedSkills.add(sk.id); save(); renderShop(); render(); }
        };
      }
      item.appendChild(btn);
      c.appendChild(item);
    });
  }
}

function renderLevelGrid() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const btn = document.createElement('button');
    btn.className = 'level-btn';
    btn.textContent = lv.id;
    if (i > maxUnlockedLevel) btn.classList.add('locked');
    else if (i === currentLevelIndex) btn.classList.add('current');
    else if (i < maxUnlockedLevel) btn.classList.add('done');
    btn.onclick = () => {
      if (i > maxUnlockedLevel) return;
      document.getElementById('levelsModal').classList.remove('show');
      initLevel(i);
    };
    grid.appendChild(btn);
  });
}

// ============ 启动 ============
initLevel(0);
render();
</script>
